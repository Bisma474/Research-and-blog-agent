# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Two services from the same repo:
#   - research-blog-api  (FastAPI + CrewAI, persistent disk for SQLite)
#   - research-blog-ui   (Next.js, calls the API)
#
# Usage:
#   1. Push this repo to GitHub
#   2. Sign in to https://dashboard.render.com and click "New +" -> "Blueprint"
#   3. Point it at this repo; Render reads render.yaml automatically
#   4. Set GROQ_API_KEY and (optionally) SERPER_API_KEY when prompted
#   5. Wait ~5 min for the first deploy
#   6. Share the UI URL on your resume: https://research-blog-ui.onrender.com

services:
  - type: web
    name: research-blog-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # --app-dir src puts src/ on sys.path so `api.main` is importable.
    startCommand: uvicorn --app-dir src api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      # Free tier has no persistent disk, so SQLite lives in /tmp and the
      # service falls back to an in-memory DB if /tmp is unwritable.
      # Run history resets on every redeploy / instance restart.
      - key: DATABASE_URL
        value: sqlite:////tmp/runs.db
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: EXTRA_CORS_ORIGINS
        value: https://research-blog-ui.onrender.com
      - key: GROQ_API_KEY
        sync: false
      # SERPER_API_KEY is optional. Leave empty to skip web search and rely
      # on the LLM's training data. Get a free key at https://serper.dev
      - key: SERPER_API_KEY
        sync: false
      - key: MODEL
        value: groq/llama-3.3-70b-versatile

  - type: web
    name: research-blog-ui
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_BASE
        value: https://research-blog-api.onrender.com/api/v1
