services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: research-blog-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/runs.db
    volumes:
      - ./data:/data
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: research-blog-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  frontend_node_modules:
